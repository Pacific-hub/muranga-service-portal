<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Citizen Dashboard | Murang'a County Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- Citizen Top Navigation -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <img
          src="/images/logo.png"
          alt="Murang'a County Logo"
          class="w-10 h-10 object-contain"
          onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');"
        />
        <div class="hidden w-10 h-10 rounded-full bg-emerald-900 border-2 border-amber-400 flex items-center justify-center text-white shadow-sm">
          <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3l8 4.5v6c0 5-3.5 9.2-8 10.5-4.5-1.3-8-5.5-8-10.5v-6L12 3z" />
          </svg>
        </div>
        <div>
          <span class="font-bold text-slate-900 text-sm block leading-none">Citizen Service Portal</span>
          <span class="text-xs text-slate-500">Murang'a County Government</span>
        </div>
      </a>

      <div class="flex items-center gap-4">
        <span id="citizenUserName" class="text-xs font-medium text-slate-700"></span>
        <button id="logoutBtn" class="text-xs font-medium text-red-600 hover:text-red-700 px-3 py-1.5 rounded-lg border border-slate-200">
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

      <!-- Left Column: Submit Service Request Form (5 cols) -->
      <section class="lg:col-span-5">
        <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
          <h2 class="text-base font-bold text-slate-900 mb-1">Submit a Service Request</h2>
          <p class="text-xs text-slate-500 mb-5">Provide accurate location details for faster field dispatch.</p>

          <div id="submitSuccessAlert" class="hidden mb-4 p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-xs text-emerald-800"></div>

          <form id="citizenRequestForm" class="space-y-4" enctype="multipart/form-data">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">Service Category *</label>
              <select id="reqCategory" required
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-700">
                <option value="">Select category...</option>
                <option value="Streetlighting">Streetlighting</option>
                <option value="Water & Sewerage">Water & Sewerage</option>
                <option value="Garbage Collection">Garbage Collection</option>
                <option value="Roads & Drainage">Roads & Drainage</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">Sub-County *</label>
              <select id="reqSubCounty" required
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-700">
                <option value="">Select Sub-County...</option>
                <option value="Kiharu">Kiharu</option>
                <option value="Maragua">Maragua</option>
                <option value="Kandara">Kandara</option>
                <option value="Gatanga">Gatanga</option>
                <option value="Kigumo">Kigumo</option>
                <option value="Kangema">Kangema</option>
                <option value="Mathioya">Mathioya</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">Specific Location / Landmark *</label>
              <input id="reqLocation" type="text" required placeholder="e.g. Mukuyu Market near Posta"
                class="w-full rounded-lg border border-slate-300 px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700" />
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">Issue Description *</label>
              <textarea id="reqDescription" rows="3" required placeholder="Describe the issue clearly..."
                class="w-full rounded-lg border border-slate-300 px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700"></textarea>
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">Attach Photo Evidence (Optional)</label>
              <input id="reqImage" type="file" accept="image/*"
                class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-medium file:bg-emerald-50 file:text-emerald-800 hover:file:bg-emerald-100" />
            </div>

            <button type="submit"
              class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-semibold py-2.5 rounded-lg text-sm transition">
              Submit Request
            </button>
          </form>
        </div>
      </section>

      <!-- Right Column: My Submitted Requests & Status Tracking (7 cols) -->
      <section class="lg:col-span-7">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-base font-bold text-slate-900">My Service Requests</h2>
            <p class="text-xs text-slate-500">Live status tracking from Pending to Resolved</p>
          </div>
          <select id="citizenStatusFilter" class="rounded-lg border border-slate-300 px-3 py-1.5 text-xs bg-white">
            <option value="All">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
        </div>

        <div id="citizenRequestsList" class="space-y-4"></div>
      </section>

    </div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
