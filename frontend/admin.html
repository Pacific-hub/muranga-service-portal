<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Administration | Murang'a County Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- Distinct Admin Top Bar -->
  <header class="bg-slate-900 text-white sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <img
          src="/images/logo.png"
          alt="Murang'a County Logo"
          class="w-10 h-10 object-contain bg-white rounded-full p-0.5"
          onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');"
        />
        <div class="hidden w-10 h-10 rounded-full bg-emerald-800 border-2 border-amber-400 flex items-center justify-center text-white shadow-sm">
          <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3l8 4.5v6c0 5-3.5 9.2-8 10.5-4.5-1.3-8-5.5-8-10.5v-6L12 3z" />
          </svg>
        </div>
        <div>
          <span class="font-bold text-sm block leading-none">County Operations & Dispatch Dashboard</span>
          <span class="text-xs text-slate-400">Murang'a County Staff Portal</span>
        </div>
      </a>

      <div class="flex items-center gap-4">
        <span id="adminUserName" class="text-xs text-slate-300"></span>
        <button id="logoutBtn" class="text-xs font-medium bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-700">
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-8">

    <!-- Analytics Section (Open vs Resolved + Breakdown) -->
    <section>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white p-5 rounded-xl border border-slate-200">
          <span class="text-xs font-medium text-slate-500">Total Reported Cases</span>
          <p id="statTotal" class="text-2xl font-bold text-slate-900 mt-1">0</p>
        </div>
        <div class="bg-white p-5 rounded-xl border border-amber-200">
          <span class="text-xs font-medium text-amber-700">Open Cases (Pending + In Progress)</span>
          <p id="statOpen" class="text-2xl font-bold text-amber-600 mt-1">0</p>
          <p id="statOpenBreakdown" class="text-xs text-slate-500 mt-1">0 Pending &bull; 0 In Progress</p>
        </div>
        <div class="bg-white p-5 rounded-xl border border-emerald-200">
          <span class="text-xs font-medium text-emerald-800">Resolved Cases</span>
          <p id="statResolved" class="text-2xl font-bold text-emerald-700 mt-1">0</p>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200">
          <span class="text-xs font-medium text-slate-500">Resolution Rate</span>
          <p id="statRate" class="text-2xl font-bold text-slate-900 mt-1">0%</p>
          <div class="w-full bg-slate-100 h-2 rounded-full mt-2 overflow-hidden">
            <div id="statRateBar" class="bg-emerald-600 h-full transition-all" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Filter & Search Bar -->
    <section class="bg-white p-4 rounded-xl border border-slate-200 flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-3 flex-1">
        <input id="adminSearch" type="text" placeholder="Search ticket ID, location, or citizen..."
          class="rounded-lg border border-slate-300 px-3.5 py-2 text-xs w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-emerald-700" />

        <select id="adminCategoryFilter" class="rounded-lg border border-slate-300 px-3 py-2 text-xs bg-white">
          <option value="All">All Categories</option>
          <option value="Streetlighting">Streetlighting</option>
          <option value="Water & Sewerage">Water & Sewerage</option>
          <option value="Garbage Collection">Garbage Collection</option>
          <option value="Roads & Drainage">Roads & Drainage</option>
        </select>

        <select id="adminStatusFilter" class="rounded-lg border border-slate-300 px-3 py-2 text-xs bg-white">
          <option value="All">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
        </select>
      </div>

      <button id="exportCsvBtn" class="text-xs font-semibold text-emerald-800 bg-emerald-50 hover:bg-emerald-100 px-4 py-2 rounded-lg transition">
        Export CSV Report
      </button>
    </section>

    <!-- All Citizen Issues Table -->
    <section class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600">
              <th class="py-3.5 px-4">Ticket</th>
              <th class="py-3.5 px-4">Citizen</th>
              <th class="py-3.5 px-4">Category & Location</th>
              <th class="py-3.5 px-4">Description & Evidence</th>
              <th class="py-3.5 px-4">Current Status</th>
              <th class="py-3.5 px-4">Update Status & Remarks</th>
            </tr>
          </thead>
          <tbody id="adminRequestsTable" class="divide-y divide-slate-200 text-xs"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="/js/app.js"></script>
</body>
</html>
